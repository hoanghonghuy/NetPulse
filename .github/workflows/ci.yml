name: CI

on:
  push:
    branches: [main, develop, feature/*]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2022
    name: Build (${{ matrix.build_type }})

    strategy:
      matrix:
        build_type: [Debug, Release]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: v5-${{ runner.os }}-cmake-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'tests/CMakeLists.txt', 'src/**', 'include/**') }}
          restore-keys: |
            v5-${{ runner.os }}-cmake-${{ matrix.build_type }}-

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTS=ON

      - name: Build (${{ matrix.build_type }})
        shell: pwsh
        run: |
          cmake --build build --config ${{ matrix.build_type }} --verbose *>&1 | Tee-Object build-${{ matrix.build_type }}.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build-${{ matrix.build_type }}.log -Tail 200
            throw "Build failed with exit code $LASTEXITCODE"
          }

      - name: Run tests
        working-directory: build
        run: ctest -C ${{ matrix.build_type }} -LE e2e --output-on-failure --verbose

      - name: Upload Release artifact
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-${{ github.sha }}
          path: build/Release/NetPulse.exe
          retention-days: 30

  coverage:
    runs-on: windows-2022
    name: Coverage (Debug)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build-coverage -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTS=ON

      - name: Build test targets (Debug)
        shell: pwsh
        run: |
          cmake --build build-coverage --config Debug --target NetPulseTests NetPulseE2ETests --verbose *>&1 | Tee-Object build-coverage-Debug.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build-coverage-Debug.log -Tail 200
            throw "Coverage build failed with exit code $LASTEXITCODE"
          }

      - name: Install OpenCppCoverage
        run: choco install opencppcoverage -y --no-progress

      - name: Run coverage
        shell: pwsh
        run: |
          $unitExe = "build-coverage/tests/Debug/NetPulseTests.exe"
          if (-not (Test-Path $unitExe)) {
            throw "Test binary not found: $unitExe"
          }

          $coverageToolCandidates = @(
            "C:\ProgramData\chocolatey\bin\OpenCppCoverage.exe",
            "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe",
            "C:\Program Files (x86)\OpenCppCoverage\OpenCppCoverage.exe"
          )
          $coverageTool = $coverageToolCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $coverageTool) {
            $coverageCommand = Get-Command OpenCppCoverage -ErrorAction SilentlyContinue
            if ($coverageCommand) {
              $coverageTool = $coverageCommand.Source
            }
          }
          if (-not $coverageTool) {
            throw "OpenCppCoverage executable not found after Chocolatey install"
          }
          Write-Host "Using OpenCppCoverage: $coverageTool"

          & $coverageTool `
            --sources "${{ github.workspace }}/src" `
            --sources "${{ github.workspace }}/include" `
            --excluded_sources "${{ github.workspace }}/third_party" `
            --excluded_sources "${{ github.workspace }}/tests" `
            --export_type "cobertura:build-coverage/coverage.xml" `
            --export_type "html:build-coverage/coverage-html" `
            -- $unitExe

      - name: Enforce coverage gate (40% line rate)
        shell: pwsh
        run: |
          $coverageXml = "build-coverage/coverage.xml"
          if (-not (Test-Path $coverageXml)) {
            throw "Coverage report not found: $coverageXml"
          }
          [xml]$report = Get-Content $coverageXml
          $lineRate = [double]$report.coverage.'line-rate'
          $threshold = 0.39
          $percent = [math]::Round($lineRate * 100, 2)
          Write-Host "Line coverage: $percent% (gate: $($threshold * 100)%)"
          if ($lineRate -lt $threshold) {
            throw "Coverage gate failed: $percent% < $($threshold * 100)%"
          }

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: |
            build-coverage/coverage.xml
            build-coverage/coverage-html/
          retention-days: 14

  # Automatic release when tag pushed
  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: NetPulse-${{ github.sha }}
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/NetPulse.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
