name: CI

on:
  push:
    branches: [main, develop, feature/*]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    name: Build (${{ matrix.build_type }})

    strategy:
      matrix:
        build_type: [Debug, Release]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: v2-${{ runner.os }}-cmake-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'tests/CMakeLists.txt', 'src/**', 'include/**') }}
          restore-keys: |
            v2-${{ runner.os }}-cmake-${{ matrix.build_type }}-

      - name: Configure CMake
        run: cmake -S . -B build -DBUILD_TESTS=ON

      - name: Build (${{ matrix.build_type }})
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run tests
        working-directory: build
        run: ctest -C ${{ matrix.build_type }} --output-on-failure --verbose

      - name: Upload Release artifact
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-${{ github.sha }}
          path: build/Release/NetPulse.exe
          retention-days: 30

  coverage:
    runs-on: windows-latest
    name: Coverage (Debug)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build-coverage -DBUILD_TESTS=ON

      - name: Build NetPulseTests (Debug)
        run: cmake --build build-coverage --config Debug --target NetPulseTests

      - name: Install OpenCppCoverage
        run: choco install opencppcoverage -y --no-progress

      - name: Run coverage
        shell: pwsh
        run: |
          $testExe = "build-coverage/Debug/tests/NetPulseTests.exe"
          if (-not (Test-Path $testExe)) {
            throw "Test binary not found: $testExe"
          }
          OpenCppCoverage `
            --sources "${{ github.workspace }}/src" `
            --sources "${{ github.workspace }}/include" `
            --excluded_sources "${{ github.workspace }}/third_party" `
            --excluded_sources "${{ github.workspace }}/tests" `
            --export_type "cobertura:build-coverage/coverage.xml" `
            --export_type "html:build-coverage/coverage-html" `
            -- $testExe

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: |
            build-coverage/coverage.xml
            build-coverage/coverage-html/
          retention-days: 14

  # Automatic release when tag pushed
  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: NetPulse-${{ github.sha }}
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/NetPulse.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
